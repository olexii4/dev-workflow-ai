schemaVersion: 2.2.2
metadata:
  name: devworkspace-operator
  generateName: devworkspace-operator-
  description: DevWorkspace Operator — Go Kubernetes operator

projects:
  - name: devworkspace-operator
    git:
      remotes:
        origin: https://github.com/devfile/devworkspace-operator.git
      checkoutFrom:
        revision: main

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 4G
      memoryRequest: 512Mi
      cpuLimit: 4000m
      cpuRequest: 500m
      mountSources: true

commands:
  - id: build
    exec:
      label: "Build operator binary"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "make build"
      group:
        kind: build
        isDefault: true

  - id: test
    exec:
      label: "Run unit tests"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "make test"
      group:
        kind: test
        isDefault: true

  - id: lint
    exec:
      label: "Lint"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "make lint"
      group:
        kind: test

  - id: generate
    exec:
      label: "Generate CRDs and code"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "make generate && make manifests"
      group:
        kind: build
