schemaVersion: 2.2.2
metadata:
  name: dash-licenses
  generateName: dash-licenses-
  description: Eclipse Dash License Tool — Maven Java, validates OSS licenses

projects:
  - name: dash-licenses
    git:
      remotes:
        origin: https://github.com/che-incubator/dash-licenses.git
      checkoutFrom:
        revision: main

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3G
      memoryRequest: 512Mi
      cpuLimit: 2000m
      cpuRequest: 500m
      mountSources: true

commands:
  - id: build
    exec:
      label: "Build (skip tests)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "mvn clean install -DskipTests -q"
      group:
        kind: build
        isDefault: true

  - id: test
    exec:
      label: "Run tests"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "mvn test"
      group:
        kind: test
        isDefault: true
