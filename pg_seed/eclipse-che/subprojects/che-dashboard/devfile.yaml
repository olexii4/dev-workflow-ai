schemaVersion: 2.2.2
metadata:
  name: che-dashboard
  generateName: che-dashboard-
  description: Eclipse Che Dashboard — TypeScript/React web UI

projects:
  - name: che-dashboard
    git:
      remotes:
        origin: https://github.com/eclipse-che/che-dashboard.git
      checkoutFrom:
        revision: main

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 6G
      memoryRequest: 512Mi
      cpuLimit: 4000m
      cpuRequest: 500m
      mountSources: true
      endpoints:
        - name: ui
          exposure: public
          protocol: https
          targetPort: 5173
          path: /

commands:
  - id: install
    exec:
      label: "Install dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn install"
      group:
        kind: build
        isDefault: true

  - id: build
    exec:
      label: "Build all packages"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn build"
      group:
        kind: build

  - id: test
    exec:
      label: "Run tests"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn test"
      group:
        kind: test
        isDefault: true

  - id: lint
    exec:
      label: "Lint"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn lint"
      group:
        kind: test

  - id: dev-frontend
    exec:
      label: "Start frontend dev server"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn dev:frontend"
      group:
        kind: run
        isDefault: true
