schemaVersion: 2.2.2
metadata:
  name: che-ai-tool-images
  generateName: che-ai-tool-images-
  description: che-ai-tool-images — Dockerfiles for AI tool sidecar images

projects:
  - name: che-ai-tool-images
    git:
      remotes:
        origin: https://github.com/che-incubator/che-ai-tool-images.git
      checkoutFrom:
        revision: main

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 2G
      memoryRequest: 256Mi
      cpuLimit: 2000m
      cpuRequest: 500m
      mountSources: true

commands:
  - id: lint-dockerfiles
    exec:
      label: "Lint Dockerfiles (hadolint)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "find . -name 'Dockerfile*' | xargs hadolint 2>/dev/null || echo 'hadolint not found — skipping'"
      group:
        kind: test
        isDefault: true

  - id: list-images
    exec:
      label: "List all image definitions"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "find . -name 'Dockerfile*' | sort"
      group:
        kind: build
