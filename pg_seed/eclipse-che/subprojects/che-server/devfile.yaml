schemaVersion: 2.2.2
metadata:
  name: che-server
  generateName: che-server-
  description: Eclipse Che Server — Java/Maven Kubernetes backend

projects:
  - name: che-server
    git:
      remotes:
        origin: https://github.com/eclipse-che/che-server.git
      checkoutFrom:
        revision: main

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 4G
      memoryRequest: 512Mi
      cpuLimit: 4000m
      cpuRequest: 500m
      mountSources: true

commands:
  - id: build
    exec:
      label: "Build (skip tests)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "mvn clean install -DskipTests -q"
      group:
        kind: build
        isDefault: true

  - id: test
    exec:
      label: "Run tests"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "mvn test"
      group:
        kind: test
        isDefault: true

  - id: lint
    exec:
      label: "Checkstyle"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "mvn checkstyle:check"
      group:
        kind: test
