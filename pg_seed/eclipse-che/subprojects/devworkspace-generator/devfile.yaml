schemaVersion: 2.2.2
metadata:
  name: devworkspace-generator
  generateName: devworkspace-generator-
  description: DevWorkspace Generator — TypeScript, converts Devfiles to DevWorkspace CRs

projects:
  - name: devworkspace-generator
    git:
      remotes:
        origin: https://github.com/che-incubator/devworkspace-generator.git
      checkoutFrom:
        revision: main

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3G
      memoryRequest: 512Mi
      cpuLimit: 2000m
      cpuRequest: 500m
      mountSources: true

commands:
  - id: install
    exec:
      label: "Install dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn install"
      group:
        kind: build
        isDefault: true

  - id: build
    exec:
      label: "Build"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn build"
      group:
        kind: build

  - id: test
    exec:
      label: "Run tests"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn test"
      group:
        kind: test
        isDefault: true

  - id: lint
    exec:
      label: "Lint"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn lint"
      group:
        kind: test
