schemaVersion: 2.2.2
metadata:
  name: che
  generateName: che-
  description: Eclipse Che umbrella repo — CI/CD, release coordination, cross-repo issues

projects:
  - name: che
    git:
      remotes:
        origin: https://github.com/eclipse-che/che.git
      checkoutFrom:
        revision: main

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 2G
      memoryRequest: 256Mi
      cpuLimit: 2000m
      cpuRequest: 500m
      mountSources: true

commands:
  - id: validate-devfiles
    exec:
      label: "Validate Devfiles"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "find . -name 'devfile.yaml' | head -20 | xargs -I{} echo 'Found: {}'"
      group:
        kind: test
        isDefault: true

  - id: list-workflows
    exec:
      label: "List GitHub Actions workflows"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "ls -la .github/workflows/ 2>/dev/null || echo 'No workflows dir'"
      group:
        kind: build
