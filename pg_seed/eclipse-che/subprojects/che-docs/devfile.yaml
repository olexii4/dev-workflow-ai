schemaVersion: 2.2.2
metadata:
  name: che-docs
  generateName: che-docs-
  description: Eclipse Che Docs — AsciiDoc/Antora documentation site

projects:
  - name: che-docs
    git:
      remotes:
        origin: https://github.com/eclipse-che/che-docs.git
      checkoutFrom:
        revision: main

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 2G
      memoryRequest: 256Mi
      cpuLimit: 2000m
      cpuRequest: 500m
      mountSources: true
      endpoints:
        - name: preview
          exposure: public
          protocol: https
          targetPort: 4000
          path: /

commands:
  - id: build
    exec:
      label: "Build docs site (Antora)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn build 2>/dev/null || npx antora antora-playbook.yml"
      group:
        kind: build
        isDefault: true

  - id: preview
    exec:
      label: "Preview docs locally"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn serve 2>/dev/null || npx serve build/site -l 4000"
      group:
        kind: run
        isDefault: true

  - id: vale-lint
    exec:
      label: "Vale prose lint"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "vale --config=.vale.ini modules/ 2>/dev/null || echo 'vale not installed'"
      group:
        kind: test
